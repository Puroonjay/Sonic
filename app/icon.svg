  <!-- Squircle Background -->
  <rect x="1" y="1" width="34" height="34" rx="9" fill="url(#sonic_bg_grad)" stroke="url(#sonic_grad_primary)" stroke-width="1.5" />

  <!-- Supersonic Waveform S Monogram -->
  <path d="M26 11.5C26 8.46 22.42 6.5 18 6.5C13.58 6.5 10 8.46 10 11.5C10 15 15.5 16 18 16.8C21.5 18 26 19.5 26 24.5C26 27.54 22.42 29.5 18 29.5C13.58 29.5 10 27.54 10 24.5" stroke="url(#sonic_grad_primary)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" />

  <!-- Equalizer soundwave bars -->
