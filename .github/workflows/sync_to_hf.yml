name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -n "$HF_TOKEN" ]; then
            git push https://Puroonjay:$HF_TOKEN@huggingface.co/spaces/Puroonjay/sonic-rag-backend main:main --force
          else
            echo "HF_TOKEN secret is not set in GitHub repository secrets. Skipping auto-sync."
          fi
